<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" role="img" aria-labelledby="crossTitle crossDesc">
  <title id="crossTitle">Eelgrass cross-section diagram</title>
  <desc id="crossDesc">A cross-section view of an eelgrass meadow showing water, light, sediment, rhizomes, and how pollution traps the system.</desc>

  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#a8d5e5" />
      <stop offset="60%" stop-color="#7eb8c9" />
      <stop offset="100%" stop-color="#5a9aa8" />
    </linearGradient>
    <linearGradient id="sediment" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c9b99a" />
      <stop offset="100%" stop-color="#a08b6c" />
    </linearGradient>
    <linearGradient id="rhizome" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8fbc8f" />
      <stop offset="100%" stop-color="#6b9b6b" />
    </linearGradient>
    <filter id="blurLight" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" />
    </filter>
  </defs>

  <!-- Sky / air -->
  <rect x="0" y="0" width="800" height="80" fill="#eef6f9" />

  <!-- Sun -->
  <circle cx="720" cy="45" r="22" fill="#f6d365" />
  <g stroke="#f6d365" stroke-width="2" opacity="0.6">
    <line x1="720" y1="12" x2="720" y2="0" />
    <line x1="720" y1="78" x2="720" y2="90" />
    <line x1="687" y1="45" x2="675" y2="45" />
    <line x1="753" y1="45" x2="765" y2="45" />
    <line x1="696" y1="21" x2="688" y2="13" />
    <line x1="744" y1="21" x2="752" y2="13" />
    <line x1="696" y1="69" x2="688" y2="77" />
    <line x1="744" y1="69" x2="752" y2="77" />
  </g>

  <!-- Labels at top -->
  <text x="60" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#1a2b4a" font-weight="bold">Sunlight</text>
  <text x="60" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#5a6c7d">Blocked by sediment &amp; algae</text>

  <!-- Arrows from sun down -->
  <g stroke="#f6d365" stroke-width="2" opacity="0.5">
    <line x1="720" y1="70" x2="680" y2="160" />
    <line x1="720" y1="70" x2="500" y2="160" />
    <line x1="720" y1="70" x2="320" y2="160" />
  </g>

  <!-- Water column -->
  <rect x="0" y="80" width="800" height="220" fill="url(#water)" />

  <!-- Surface waves -->
  <path d="M0,80 Q40,72 80,80 T160,80 T240,80 T320,80 T400,80 T480,80 T560,80 T640,80 T720,80 T800,80" fill="none" stroke="#d6ebf2" stroke-width="2" />

  <!-- Sediment bed -->
  <path d="M0,300 Q120,290 240,300 T480,295 T800,300 L800,520 L0,520 Z" fill="url(#sediment)" />

  <!-- Sediment surface line -->
  <path d="M0,300 Q120,290 240,300 T480,295 T800,300" fill="none" stroke="#8b7355" stroke-width="2" />

  <!-- Eelgrass blades -->
  <g fill="none" stroke="#4a8a5a" stroke-width="5" stroke-linecap="round">
    <path d="M120,300 Q115,230 130,150 Q135,120 125,95" />
    <path d="M140,305 Q150,240 135,170 Q125,140 140,110" />
    <path d="M160,302 Q155,235 170,165 Q180,130 165,100" />
    <path d="M260,300 Q250,225 270,150 Q280,120 265,95" />
    <path d="M285,298 Q295,230 275,170 Q265,140 285,110" />
    <path d="M305,302 Q300,235 320,160 Q330,125 310,100" />
    <path d="M430,295 Q425,220 445,145 Q455,115 435,95" />
    <path d="M455,298 Q465,230 445,175 Q435,145 455,120" />
    <path d="M475,296 Q470,225 490,155 Q500,120 480,100" />
    <path d="M600,300 Q590,225 610,155 Q620,120 605,95" />
    <path d="M625,302 Q635,235 615,175 Q605,145 625,115" />
    <path d="M645,298 Q640,230 660,160 Q670,125 650,105" />
  </g>

  <!-- Eelgrass flowers/seeds detail -->
  <g fill="#6b9b6b">
    <circle cx="125" cy="98" r="3" />
    <circle cx="285" cy="110" r="3" />
    <circle cx="455" cy="118" r="3" />
    <circle cx="625" cy="112" r="3" />
  </g>

  <!-- Rhizome network in sediment -->
  <g fill="none" stroke="url(#rhizome)" stroke-width="4" stroke-linecap="round">
    <path d="M50,330 Q120,320 180,340 T300,330 T420,345 T540,335 T660,350 T760,340" />
    <path d="M80,360 Q140,350 200,370 T320,360 T440,375 T560,365 T680,380 T780,370" />
    <path d="M30,390 Q100,380 160,400 T280,390 T400,405 T520,395 T640,410 T740,400" />
    <path d="M120,300 L120,320 M140,305 L140,325 M160,302 L160,322 M260,300 L260,320 M285,298 L285,318 M305,302 L305,322" stroke="#7fb069" stroke-width="3" />
    <path d="M430,295 L430,315 M455,298 L455,318 M475,296 L475,316 M600,300 L600,320 M625,302 L625,322 M645,298 L645,318" stroke="#7fb069" stroke-width="3" />
  </g>

  <!-- Roots / anchors -->
  <g stroke="#6b8e6b" stroke-width="2" fill="none">
    <path d="M120,320 L110,350 L115,370 M140,325 L135,360 M160,322 L170,355 M260,320 L250,350 L255,370" />
    <path d="M285,318 L280,350 M305,322 L315,355 M430,315 L420,345 M455,318 L450,350 M475,316 L485,345" />
    <path d="M600,320 L590,350 M625,322 L620,355 M645,318 L655,350" />
  </g>

  <!-- Pollutant / nutrient particles -->
  <g fill="#bd261d" opacity="0.7">
    <circle cx="200" cy="180" r="4" />
    <circle cx="230" cy="220" r="5" />
    <circle cx="350" cy="190" r="4" />
    <circle cx="520" cy="210" r="5" />
    <circle cx="680" cy="175" r="4" />
    <circle cx="150" cy="240" r="3" />
    <circle cx="400" cy="230" r="4" />
    <circle cx="600" cy="245" r="3" />
  </g>

  <!-- Sediment pollution / organic carbon trapped -->
  <g fill="#4a3728" opacity="0.35">
    <ellipse cx="220" cy="390" rx="80" ry="25" />
    <ellipse cx="470" cy="410" rx="100" ry="30" />
    <ellipse cx="680" cy="385" rx="70" ry="22" />
  </g>

  <!-- Algae / turbidity cloud -->
  <g fill="#8fbc8f" opacity="0.25">
    <ellipse cx="360" cy="150" rx="140" ry="35" />
    <ellipse cx="580" cy="165" rx="110" ry="28" />
  </g>

  <!-- Fish / juvenile fish -->
  <g fill="#2166ac">
    <path d="M180,200 Q190,195 200,200 Q190,205 180,200 M190,198 L185,196 L185,204 Z" />
    <path d="M560,190 Q570,185 580,190 Q570,195 560,190 M570,188 L565,186 L565,192 Z" />
    <path d="M380,240 Q390,235 400,240 Q390,245 380,240 M390,238 L385,236 L385,242 Z" />
  </g>

  <!-- Labels -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
    <text x="20" y="115" font-size="13" fill="#1a2b4a" font-weight="bold">Water column</text>
    <text x="20" y="132" font-size="11" fill="#3d5a6b">Slow flushing traps pollutants</text>

    <text x="20" y="330" font-size="13" fill="#1a2b4a" font-weight="bold">Sediment bed</text>
    <text x="20" y="347" font-size="11" fill="#5a4a35">Legacy carbon &amp; nutrients locked in mud</text>

    <text x="520" y="490" font-size="13" fill="#1a2b4a" font-weight="bold">Rhizome network</text>
    <text x="520" y="507" font-size="11" fill="#3d5a35">Holds sediment together; loses strength as eelgrass dies</text>
  </g>

  <!-- Callout for the light-blocking effect -->
  <g opacity="0.5">
    <rect x="270" y="95" width="240" height="35" rx="4" fill="#fff" />
  </g>
  <text x="390" y="118" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#1a2b4a" font-weight="bold">Sediment + algae cloud the water → less light reaches eelgrass</text>

  <!-- Source line -->
  <text x="780" y="505" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#6c757d">Illustration: Aaron R. Davis / Source: PREP, UNH research.</text>
</svg>
